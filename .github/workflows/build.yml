name: Build SentroFPS Launcher

on:
  push:
    tags:
      - 'v*.*.*'   # Ex: v1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SentroFPS/launcher-wpf/SentroFPS.Launcher.csproj

      - name: Build launcher
        run: dotnet publish SentroFPS/launcher-wpf/SentroFPS.Launcher.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained true -o out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentrofps-launcher
          path: out/**
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sentrofps-launcher
          path: out
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
